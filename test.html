
  <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>MathTest1</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:
linear-gradient(
135deg,
#0f172a,
#111827,
#1e293b
);
min-height:100vh;
color:white;
overflow-x:hidden;
}

/* BG */

body::before{
content:'';
position:fixed;
width:400px;
height:400px;
background:
rgba(59,130,246,0.15);
border-radius:50%;
top:-150px;
left:-100px;
filter:blur(80px);
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:400px;
height:400px;
background:
rgba(168,85,247,0.15);
border-radius:50%;
bottom:-150px;
right:-100px;
filter:blur(80px);
z-index:-1;
}

h2{
text-align:center;
padding:18px;
font-size:2rem;
}

/* LOGIN */

#loginPage{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.login-box{
width:100%;
max-width:380px;
background:
rgba(255,255,255,0.08);
border:
1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(14px);
border-radius:24px;
padding:35px 30px;
animation:fadeUp 0.5s ease;
}

.login-box h3{
text-align:center;
margin-bottom:20px;
}

.login-box input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
outline:none;
border-radius:14px;
background:
rgba(255,255,255,0.08);
color:white;
}

button{
padding:14px 24px;
border:none;
border-radius:14px;
background:
linear-gradient(
135deg,
#2563eb,
#7c3aed
);
color:white;
cursor:pointer;
font-weight:600;
transition:0.25s;
}

button:hover{
transform:
translateY(-2px)
scale(1.02);
}

button:disabled{
opacity:0.5;
cursor:not-allowed;
}

.login-box button{
width:100%;
margin-top:15px;
}

#error{
color:#f87171;
margin-top:12px;
text-align:center;
}

/* HEADER */

#header{
position:sticky;
top:0;
z-index:1000;
background:
rgba(15,23,42,0.8);
backdrop-filter:blur(12px);
padding:14px 20px;
border-bottom:
1px solid rgba(255,255,255,0.08);
}

.top-row{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
}

#timer{
font-size:1.1rem;
font-weight:bold;
color:#facc15;
}

/* PROGRESS */

#progressContainer{
width:100%;
height:12px;
background:
rgba(255,255,255,0.08);
border-radius:20px;
margin-top:14px;
overflow:hidden;
}

#progressBar{
height:100%;
width:0%;
background:
linear-gradient(
90deg,
#22c55e,
#3b82f6
);
transition:0.3s;
}

/* LAYOUT */

#quizPage{
display:none;
}

.main-layout{
display:grid;
grid-template-columns:
280px 1fr;
gap:20px;
padding:20px;
}

/* PALETTE */

#palette{
background:
rgba(255,255,255,0.08);
border:
1px solid rgba(255,255,255,0.08);
border-radius:24px;
padding:20px;
height:fit-content;
position:sticky;
top:120px;
}

.palette-grid{
display:grid;
grid-template-columns:
repeat(5,1fr);
gap:10px;
margin-top:15px;
}

.palette-btn{
width:42px;
height:42px;
border-radius:12px;
border:none;
cursor:pointer;
font-weight:bold;
background:#475569;
color:white;
}

.palette-btn.visited{
background:#2563eb;
}

.palette-btn.answered{
background:#16a34a;
}

.palette-btn.current{
outline:3px solid white;
}

/* QUESTION */

.question-card{
background:
rgba(255,255,255,0.08);
border:
1px solid rgba(255,255,255,0.08);
border-radius:24px;
padding:25px;
animation:fadeUp 0.3s ease;
}

.question-title{
font-size:1.2rem;
margin-bottom:20px;
line-height:1.6;
}

.option{
display:flex;
align-items:center;
gap:12px;
padding:16px;
margin-bottom:14px;
border-radius:14px;
background:
rgba(255,255,255,0.05);
cursor:pointer;
transition:0.25s;
}

.option:hover{
background:
rgba(255,255,255,0.12);
transform:translateX(4px);
}

.option input{
transform:scale(1.2);
}

.correct{
background:
rgba(34,197,94,0.3)
!important;
}

.wrong{
background:
rgba(239,68,68,0.3)
!important;
}

/* NAVIGATION */

.nav-buttons{
display:flex;
justify-content:space-between;
margin-top:25px;
gap:10px;
}

#submitBtn{
width:100%;
margin-top:20px;
}

#result{
margin-top:25px;
font-size:1.4rem;
text-align:center;
font-weight:bold;
}

/* ANIMATION */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(15px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:900px){

.main-layout{
grid-template-columns:1fr;
}

#palette{
position:static;
}

}

</style>

</head>

<body>

<h2>

📝 MathTest1

</h2>

<!-- LOGIN -->

<div id="loginPage">

<div class="login-box">

<h3>
🔐 Login
</h3>

<input
id="username"
placeholder="Username"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button onclick="login()">

Start Test

</button>

<p id="error"></p>

</div>

</div>

<!-- QUIZ -->

<div id="quizPage">

<div id="header">

<div class="top-row">

<div id="userInfo"></div>

<div id="timer">

⏳ 15:00

</div>

<div id="loginCountBox"></div>

<button
id="logoutBtn"
onclick="logout()"
style="display:none;"
>

Logout

</button>

</div>

<div id="progressContainer">

<div id="progressBar"></div>

</div>

</div>

<div class="main-layout">

<!-- PALETTE -->

<div id="palette">

<h3>
Question Palette
</h3>

<div
class="palette-grid"
id="paletteGrid"
></div>

</div>

<!-- QUESTION AREA -->

<div>

<div id="questionContainer">
</div>

<div class="nav-buttons">

<button
id="prevBtn"
onclick="prevQuestion()"
>

⬅ Previous

</button>

<button
id="nextBtn"
onclick="nextQuestion()"
>

Next ➡

</button>

</div>

<button
id="submitBtn"
onclick="submitQuiz()"
>

Submit Quiz

</button>

<div id="result"></div>

</div>

</div>

</div>

<script>

const quizKey =
"MathTest1";

const users =
[{"username":"JKP000111","password":"ramji1234","name":"RAMJI PATEL"},{"username":"JKP000112","password":"shivi9163","name":"SHIVI PATEL"},{"username":"JKP000113","password":"sadhna0000","name":"SADHNA KUSHWAHA"},{"username":"JKP000114","password":"shristi165","name":"SHRISTI KUSHWAHA"},{"username":"JKP000115","password":"naman0091","name":"NAMAN PATEL"},{"username":"JKP000116","password":"krish1011","name":"KRISH KUSHWAHA"}];

const questions =
[{"question":"Q1. सही उत्तर चुनिए (Addition / जोड़): 25 + 38 = ?","options":["53","63","73","83"],"answer":1},{"question":"Q2. सही उत्तर चुनिए (Subtraction / घटाव): 95 - 47 = ?","options":["48","58","42","38"],"answer":0},{"question":"Q3. सही उत्तर चुनिए (Multiplication / गुणा): 24 × 6 = ?","options":["124","134","144","154"],"answer":2},{"question":"Q4. सही उत्तर चुनिए (Division / भाग): 144 ÷ 12 = ?","options":["10","11","12","13"],"answer":2},{"question":"Q5. सही उत्तर चुनिए (Square / वर्ग): 27² = ?","options":["729","627","739","819"],"answer":0},{"question":"Q6. सही उत्तर चुनिए (Cube / घन): 24³ = ?","options":["12824","13824","14824","15824"],"answer":1},{"question":"Q7. सही उत्तर चुनिए (LCM): 12 और 18 का LCM क्या है?","options":["24","30","36","48"],"answer":2},{"question":"Q8. सही उत्तर चुनिए (HCF): 24 और 36 का HCF क्या है?","options":["6","8","12","18"],"answer":2},{"question":"Q9. सही उत्तर चुनिए (BODMAS): 8 + 4 × 5 = ?","options":["60","28","40","20"],"answer":1},{"question":"Q10. सही उत्तर चुनिए (Addition / जोड़): 125 + 275 = ?","options":["350","375","400","425"],"answer":2},{"question":"Q11. सही उत्तर चुनिए (Subtraction / घटाव): 500 - 275 = ?","options":["225","235","245","255"],"answer":0},{"question":"Q12. सही उत्तर चुनिए (Multiplication / गुणा): 19 × 8 = ?","options":["142","152","162","172"],"answer":1},{"question":"Q13. सही उत्तर चुनिए (Division / भाग): 225 ÷ 15 = ?","options":["12","13","14","15"],"answer":3},{"question":"Q14. सही उत्तर चुनिए (Square / वर्ग): 29² = ?","options":["821","841","861","881"],"answer":1},{"question":"Q15. सही उत्तर चुनिए (Cube / घन): 25³ = ?","options":["15625","14625","16625","17625"],"answer":0},{"question":"Q16. सही उत्तर चुनिए (LCM): 8 और 12 का LCM क्या है?","options":["12","24","36","48"],"answer":1},{"question":"Q17. सही उत्तर चुनिए (HCF): 45 और 60 का HCF क्या है?","options":["5","10","15","20"],"answer":2},{"question":"Q18. सही उत्तर चुनिए (BODMAS): 30 - 6 ÷ 2 = ?","options":["12","24","27","15"],"answer":2},{"question":"Q19. सही उत्तर चुनिए (Addition / जोड़): 349 + 151 = ?","options":["450","500","550","600"],"answer":1},{"question":"Q20. सही उत्तर चुनिए (Multiplication / गुणा): 17 × 17 = ?","options":["279","289","299","309"],"answer":1},{"question":"Q21. सही उत्तर चुनिए (Square / वर्ग): 23² = ?","options":["529","539","549","559"],"answer":0},{"question":"Q22. सही उत्तर चुनिए (Cube / घन): 30³ = ?","options":["26000","27000","28000","29000"],"answer":1},{"question":"Q23. सही उत्तर चुनिए (BODMAS): 18 + (12 ÷ 3) × 2 = ?","options":["22","24","26","28"],"answer":2},{"question":"Q24. सही उत्तर चुनिए (LCM): 15 और 20 का LCM क्या है?","options":["40","50","60","80"],"answer":2},{"question":"Q25. सही उत्तर चुनिए (HCF): 72 और 90 का HCF क्या है?","options":["12","18","24","36"],"answer":1}];

const answers =
[1,0,2,2,0,1,2,2,1,2,0,1,3,1,0,1,2,2,1,1,0,1,2,2,1];
  /* ELEMENTS */

const loginPage =
document.getElementById(
"loginPage"
);

const quizPage =
document.getElementById(
"quizPage"
);

const username =
document.getElementById(
"username"
);

const password =
document.getElementById(
"password"
);

const error =
document.getElementById(
"error"
);

const userInfo =
document.getElementById(
"userInfo"
);

const loginCountBox =
document.getElementById(
"loginCountBox"
);

const logoutBtn =
document.getElementById(
"logoutBtn"
);

const result =
document.getElementById(
"result"
);

const questionContainer =
document.getElementById(
"questionContainer"
);

const paletteGrid =
document.getElementById(
"paletteGrid"
);

const progressBar =
document.getElementById(
"progressBar"
);

const timer =
document.getElementById(
"timer"
);

const prevBtn =
document.getElementById(
"prevBtn"
);

const nextBtn =
document.getElementById(
"nextBtn"
);

/* VARIABLES */

let currentQuestion = 0;

let userAnswers = [];

let visitedQuestions = [];

let timeLeft = 15*60;

let timerInterval;

let submitted = false;

const currentUser =
sessionStorage.getItem(
quizKey+"_user"
);

/* AUTO LOGIN */

if(currentUser){

loginPage.style.display =
"none";

quizPage.style.display =
"block";

showUserInfo(currentUser);

const alreadySubmitted =
localStorage.getItem(
quizKey+
"_submitted_"+
currentUser
);

if(alreadySubmitted){

submitted = true;

restoreSubmittedQuiz();

}else{

handleLoginCount(
currentUser
);

startQuiz();

}

}

/* LOGIN */

function login(){

const u =
username.value.trim();

const p =
password.value.trim();

const valid =
users.find(
x=>x.username===u
&&
x.password===p
);

if(!valid){

error.innerText =
"Invalid Login";

return;

}

sessionStorage.setItem(
quizKey+"_user",
u
);

loginPage.style.display =
"none";

quizPage.style.display =
"block";

showUserInfo(u);

const alreadySubmitted =
localStorage.getItem(
quizKey+
"_submitted_"+
u
);

if(alreadySubmitted){

submitted = true;

restoreSubmittedQuiz();

}else{

handleLoginCount(u);

startQuiz();

}

}

/* USER INFO */

function showUserInfo(u){

const user =
users.find(
x=>x.username===u
);

if(user){

userInfo.innerHTML =
"👤 "
+
user.name
+
" ("
+
user.username
+
")";

}

}

/* LOGIN COUNT */

function handleLoginCount(user){

let count =
parseInt(

localStorage.getItem(
quizKey+
"_loginCount_"+
user
)||"0"

);

count++;

localStorage.setItem(

quizKey+
"_loginCount_"+
user,

count

);

loginCountBox.innerHTML =
"🔁 Login Count: "
+
count;

}

/* START QUIZ */

function startQuiz(){

if(
document.documentElement
.requestFullscreen
){

document.documentElement
.requestFullscreen();

}

renderPalette();

renderQuestion();

updateProgress();

startTimer();

}

/* TIMER */

function startTimer(){

timerInterval =
setInterval(()=>{

if(timeLeft<=0){

clearInterval(
timerInterval
);

submitQuiz();

return;

}

timeLeft--;

const min =
Math.floor(
timeLeft/60
);

const sec =
timeLeft%60;

timer.innerText =
"⏳ "
+
String(min)
.padStart(2,'0')
+
":"
+
String(sec)
.padStart(2,'0');

if(timeLeft<60){

timer.style.color =
"#ef4444";

}

},1000);

}
  /* PALETTE */

function renderPalette(){

paletteGrid.innerHTML='';

questions.forEach((q,i)=>{

const btn =
document.createElement(
'button'
);

btn.innerText=i+1;

btn.className =
'palette-btn';

if(
visitedQuestions.includes(i)
){
btn.classList.add(
'visited'
);
}

if(
userAnswers[i]!=null
){
btn.classList.add(
'answered'
);
}

if(i===currentQuestion){

btn.classList.add(
'current'
);

}

btn.onclick=()=>{

if(submitted) return;

currentQuestion=i;

renderQuestion();

};

paletteGrid
.appendChild(btn);

});

}

/* QUESTION */

function renderQuestion(){

if(submitted){

renderSubmittedQuestion();

return;

}

if(
!visitedQuestions.includes(
currentQuestion
)
){

visitedQuestions.push(
currentQuestion
);

}

const q =
questions[currentQuestion];

let optionsHTML = "";

q.options.forEach(
(opt,index)=>{

optionsHTML +=

'<label class="option">' +

'<input type="radio" ' +

'name="option" ' +

'value="'+index+'" ' +

(userAnswers[currentQuestion]
==index
? 'checked'
: '') +

' onchange="saveAnswer('
+
index+
')" > '

+

opt +

'</label>';

});

questionContainer.innerHTML =

'<div class="question-card">' +

'<div class="question-title">' +

'Q'+
(currentQuestion+1)
+
'. '
+
q.question +

'</div>' +

optionsHTML +

'</div>';

renderPalette();

updateProgress();

}

/* SAVE ANSWER */

function saveAnswer(ans){

if(submitted) return;

userAnswers[currentQuestion]
= ans;

renderPalette();

updateProgress();

}

/* PROGRESS */

function updateProgress(){

const answered =
userAnswers.filter(
x=>x!=null
).length;

const percent =
(answered/questions.length)
*100;

progressBar.style.width =
percent+'%';

}

/* NAVIGATION */

function nextQuestion(){

if(submitted) return;

if(
currentQuestion
<
questions.length-1
){

currentQuestion++;

renderQuestion();

}

}

function prevQuestion(){

if(submitted) return;

if(currentQuestion>0){

currentQuestion--;

renderQuestion();

}

}
  /* SUBMIT */

function submitQuiz(){

if(submitted) return;

submitted = true;

clearInterval(
timerInterval
);

const user =
sessionStorage.getItem(
quizKey+"_user"
);

let score = 0;

answers.forEach((ans,i)=>{

if(userAnswers[i]===ans){
score++;
}

});

/* SAVE */

localStorage.setItem(

quizKey+
"_submitted_"+
user,

"yes"

);

localStorage.setItem(

quizKey+
"_answers_"+
user,

JSON.stringify(
userAnswers
)

);

/* LOCK UI */

prevBtn.disabled=true;
nextBtn.disabled=true;

document.getElementById(
"submitBtn"
).style.display="none";

/* SCORE */

const finalScore =
"🎯 Score: "
+
score
+
"/"
+
answers.length;

result.innerHTML =
finalScore;

loginCountBox.innerHTML +=
" | "
+
finalScore;

logoutBtn.style.display =
"inline-block";

/* SHOW SUBMITTED MODE */

renderSubmittedQuestion();

}

/* SUBMITTED VIEW */

function renderSubmittedQuestion(){

const q =
questions[currentQuestion];

let optionsHTML = "";

q.options.forEach(
(opt,index)=>{

let className = "";

if(index===q.answer){

className="correct";

}

if(
userAnswers[currentQuestion]
===index
&&
index!==q.answer
){

className="wrong";

}

optionsHTML +=

'<label class="option '
+
className+
'">' +

'<input type="radio" disabled '

+

(userAnswers[currentQuestion]
==index
? 'checked'
: '') +

'> '

+

opt +

'</label>';

});

questionContainer.innerHTML =

'<div class="question-card">' +

'<div class="question-title">' +

'Q'+
(currentQuestion+1)
+
'. '
+
q.question +

'</div>' +

optionsHTML +

'</div>';

}

/* RESTORE */

function restoreSubmittedQuiz(){

const user =
sessionStorage.getItem(
quizKey+"_user"
);

const savedAnswers =
JSON.parse(

localStorage.getItem(
quizKey+
"_answers_"+
user
)||"[]"

);

userAnswers =
savedAnswers;

renderPalette();

renderSubmittedQuestion();

let score = 0;

answers.forEach((ans,i)=>{

if(savedAnswers[i]===ans){
score++;
}

});

const finalScore =
"🎯 Score: "
+
score
+
"/"
+
answers.length;

result.innerHTML =
finalScore;

loginCountBox.innerHTML =
"✅ Submitted | "
+
finalScore;

logoutBtn.style.display =
"inline-block";

document.getElementById(
"submitBtn"
).style.display =
"none";

prevBtn.disabled=true;
nextBtn.disabled=true;

}

/* LOGOUT */

function logout(){

sessionStorage.removeItem(
quizKey+"_user"
);

location.reload();

}

</script>

</body>

</html>
