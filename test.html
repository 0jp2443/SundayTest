
  <!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0">

<title>MathTest2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Segoe UI',sans-serif;
background:
linear-gradient(
135deg,
#0f172a,
#111827,
#1e293b
);
min-height:100vh;
color:white;
overflow-x:hidden;
}

/* BG */

body::before{
content:'';
position:fixed;
width:400px;
height:400px;
background:
rgba(59,130,246,0.15);
border-radius:50%;
top:-150px;
left:-100px;
filter:blur(80px);
z-index:-1;
}

body::after{
content:'';
position:fixed;
width:400px;
height:400px;
background:
rgba(168,85,247,0.15);
border-radius:50%;
bottom:-150px;
right:-100px;
filter:blur(80px);
z-index:-1;
}

h2{
text-align:center;
padding:18px;
font-size:2rem;
}

/* LOGIN */

#loginPage{
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.login-box{
width:100%;
max-width:380px;
background:
rgba(255,255,255,0.08);
border:
1px solid rgba(255,255,255,0.1);
backdrop-filter:blur(14px);
border-radius:24px;
padding:35px 30px;
animation:fadeUp 0.5s ease;
}

.login-box h3{
text-align:center;
margin-bottom:20px;
}

.login-box input{
width:100%;
padding:14px;
margin:10px 0;
border:none;
outline:none;
border-radius:14px;
background:
rgba(255,255,255,0.08);
color:white;
}

button{
padding:14px 24px;
border:none;
border-radius:14px;
background:
linear-gradient(
135deg,
#2563eb,
#7c3aed
);
color:white;
cursor:pointer;
font-weight:600;
transition:0.25s;
}

button:hover{
transform:
translateY(-2px)
scale(1.02);
}

button:disabled{
opacity:0.5;
cursor:not-allowed;
}

.login-box button{
width:100%;
margin-top:15px;
}

#error{
color:#f87171;
margin-top:12px;
text-align:center;
}

/* HEADER */

#header{
position:sticky;
top:0;
z-index:1000;
background:
rgba(15,23,42,0.8);
backdrop-filter:blur(12px);
padding:14px 20px;
border-bottom:
1px solid rgba(255,255,255,0.08);
}

.top-row{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
}

#timer{
font-size:1.1rem;
font-weight:bold;
color:#facc15;
}

/* PROGRESS */

#progressContainer{
width:100%;
height:12px;
background:
rgba(255,255,255,0.08);
border-radius:20px;
margin-top:14px;
overflow:hidden;
}

#progressBar{
height:100%;
width:0%;
background:
linear-gradient(
90deg,
#22c55e,
#3b82f6
);
transition:0.3s;
}

/* LAYOUT */

#quizPage{
display:none;
}

.main-layout{
display:grid;
grid-template-columns:
280px 1fr;
gap:20px;
padding:20px;
}

/* PALETTE */

#palette{
background:
rgba(255,255,255,0.08);
border:
1px solid rgba(255,255,255,0.08);
border-radius:24px;
padding:20px;
height:fit-content;
position:sticky;
top:120px;
}

.palette-grid{
display:grid;
grid-template-columns:
repeat(5,1fr);
gap:10px;
margin-top:15px;
}

.palette-btn{
width:42px;
height:42px;
border-radius:12px;
border:none;
cursor:pointer;
font-weight:bold;
background:#475569;
color:white;
}

.palette-btn.visited{
background:#2563eb;
}

.palette-btn.answered{
background:#16a34a;
}

.palette-btn.current{
outline:3px solid white;
}

/* QUESTION */

.question-card{
background:
rgba(255,255,255,0.08);
border:
1px solid rgba(255,255,255,0.08);
border-radius:24px;
padding:25px;
animation:fadeUp 0.3s ease;
}

.question-title{
font-size:1.2rem;
margin-bottom:20px;
line-height:1.6;
}

.option{
display:flex;
align-items:center;
gap:12px;
padding:16px;
margin-bottom:14px;
border-radius:14px;
background:
rgba(255,255,255,0.05);
cursor:pointer;
transition:0.25s;
}

.option:hover{
background:
rgba(255,255,255,0.12);
transform:translateX(4px);
}

.option input{
transform:scale(1.2);
}

.correct{
background:
rgba(34,197,94,0.3)
!important;
}

.wrong{
background:
rgba(239,68,68,0.3)
!important;
}

/* NAVIGATION */

.nav-buttons{
display:flex;
justify-content:space-between;
margin-top:25px;
gap:10px;
}

#submitBtn{
width:100%;
margin-top:20px;
}

#result{
margin-top:25px;
font-size:1.4rem;
text-align:center;
font-weight:bold;
}

/* ANIMATION */

@keyframes fadeUp{

from{
opacity:0;
transform:translateY(15px);
}

to{
opacity:1;
transform:translateY(0);
}

}

@media(max-width:900px){

.main-layout{
grid-template-columns:1fr;
}

#palette{
position:static;
}

}

</style>

</head>

<body>

<h2>

📝 MathTest2

</h2>

<!-- LOGIN -->

<div id="loginPage">

<div class="login-box">

<h3>
🔐 Login
</h3>

<input
id="username"
placeholder="Username"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button onclick="login()">

Start Test

</button>

<p id="error"></p>

</div>

</div>

<!-- QUIZ -->

<div id="quizPage">

<div id="header">

<div class="top-row">

<div id="userInfo"></div>

<div id="timer">

⏳ 15:00

</div>

<div id="loginCountBox"></div>

<button
id="logoutBtn"
onclick="logout()"
style="display:none;"
>

Logout

</button>

</div>

<div id="progressContainer">

<div id="progressBar"></div>

</div>

</div>

<div class="main-layout">

<!-- PALETTE -->

<div id="palette">

<h3>
Question Palette
</h3>

<div
class="palette-grid"
id="paletteGrid"
></div>

</div>

<!-- QUESTION AREA -->

<div>

<div id="questionContainer">
</div>

<div class="nav-buttons">

<button
id="prevBtn"
onclick="prevQuestion()"
>

⬅ Previous

</button>

<button
id="nextBtn"
onclick="nextQuestion()"
>

Next ➡

</button>

</div>

<button
id="submitBtn"
onclick="submitQuiz()"
>

Submit Quiz

</button>

<div id="result"></div>

</div>

</div>

</div>

<script>

const quizKey =
"MathTest2";

const users =
[{"username":"JKP000111","password":"ramji1234","name":"RAMJI PATEL"},{"username":"JKP000112","password":"shivi9163","name":"SHIVI PATEL"},{"username":"JKP000113","password":"sadhna0000","name":"SADHNA KUSHWAHA"},{"username":"JKP000114","password":"shristi165","name":"SHRISTI KUSHWAHA"},{"username":"JKP000115","password":"naman0091","name":"NAMAN PATEL"},{"username":"JKP000116","password":"krish1011","name":"KRISH KUSHWAHA"}];

const questions =
[{"question":"Q1. What is 735 + 289?","options":["1014","1024","1034","1044"],"answer":1},{"question":"Q2. What is 1000 − 587?","options":["403","413","423","433"],"answer":1},{"question":"Q3. What is 28 × 9?","options":["242","252","262","272"],"answer":1},{"question":"Q4. What is 756 ÷ 18?","options":["40","41","42","44"],"answer":2},{"question":"Q5. What is 24²?","options":["566","576","586","596"],"answer":1},{"question":"Q6. What is 28³?","options":["21852","21952","22052","22152"],"answer":1},{"question":"Q7. LCM of 16 and 20 is:","options":["40","60","80","160"],"answer":2},{"question":"Q8. HCF of 42 and 56 is:","options":["7","14","21","28"],"answer":1},{"question":"Q9. What is 23²?","options":["429","529","629","729"],"answer":1},{"question":"Q10. What is 26³?","options":["16576","17576","18576","19576"],"answer":1},{"question":"Q11. 48 + 24 ÷ 6 = ?","options":["8","48","52","72"],"answer":2},{"question":"Q12. (15 + 9) × 4 = ?","options":["86","92","96","102"],"answer":2},{"question":"Q13. What is 27²?","options":["629","729","829","929"],"answer":1},{"question":"Q14. What is 29³?","options":["23389","24389","25389","26389"],"answer":1},{"question":"Q15. HCF of 48 and 72 is:","options":["12","18","24","36"],"answer":2},{"question":"Q16. LCM of 9 and 15 is:","options":["30","45","60","90"],"answer":1},{"question":"Q17. What is 864 + 157?","options":["1011","1021","1031","1041"],"answer":1},{"question":"Q18. What is 900 − 468?","options":["422","432","442","452"],"answer":1},{"question":"Q19. What is 27 × 8?","options":["206","216","226","236"],"answer":1},{"question":"Q20. What is 324 ÷ 18?","options":["16","17","18","19"],"answer":2},{"question":"Q21. 80 − 24 ÷ 6 = ?","options":["52","66","76","80"],"answer":2},{"question":"Q22. What is 30²?","options":["800","850","900","950"],"answer":2},{"question":"Q23. What is 23³?","options":["11167","12167","13167","14167"],"answer":1},{"question":"Q24. LCM of 18 and 24 is:","options":["48","60","72","96"],"answer":2},{"question":"Q25. HCF of 54 and 90 is:","options":["9","12","18","27"],"answer":2}];

const answers =
[1,1,1,2,1,1,2,1,1,1,2,2,1,1,2,1,1,1,1,2,2,2,1,2,2];
  /* ELEMENTS */

const loginPage =
document.getElementById(
"loginPage"
);

const quizPage =
document.getElementById(
"quizPage"
);

const username =
document.getElementById(
"username"
);

const password =
document.getElementById(
"password"
);

const error =
document.getElementById(
"error"
);

const userInfo =
document.getElementById(
"userInfo"
);

const loginCountBox =
document.getElementById(
"loginCountBox"
);

const logoutBtn =
document.getElementById(
"logoutBtn"
);

const result =
document.getElementById(
"result"
);

const questionContainer =
document.getElementById(
"questionContainer"
);

const paletteGrid =
document.getElementById(
"paletteGrid"
);

const progressBar =
document.getElementById(
"progressBar"
);

const timer =
document.getElementById(
"timer"
);

const prevBtn =
document.getElementById(
"prevBtn"
);

const nextBtn =
document.getElementById(
"nextBtn"
);

/* VARIABLES */

let currentQuestion = 0;

let userAnswers = [];

let visitedQuestions = [];

let timeLeft = 15*60;

let timerInterval;

let submitted = false;

const currentUser =
sessionStorage.getItem(
quizKey+"_user"
);

/* AUTO LOGIN */

if(currentUser){

loginPage.style.display =
"none";

quizPage.style.display =
"block";

showUserInfo(currentUser);

const alreadySubmitted =
localStorage.getItem(
quizKey+
"_submitted_"+
currentUser
);

if(alreadySubmitted){

submitted = true;

restoreSubmittedQuiz();

}else{

handleLoginCount(
currentUser
);

startQuiz();

}

}

/* LOGIN */

function login(){

const u =
username.value.trim();

const p =
password.value.trim();

const valid =
users.find(
x=>x.username===u
&&
x.password===p
);

if(!valid){

error.innerText =
"Invalid Login";

return;

}

sessionStorage.setItem(
quizKey+"_user",
u
);

loginPage.style.display =
"none";

quizPage.style.display =
"block";

showUserInfo(u);

const alreadySubmitted =
localStorage.getItem(
quizKey+
"_submitted_"+
u
);

if(alreadySubmitted){

submitted = true;

restoreSubmittedQuiz();

}else{

handleLoginCount(u);

startQuiz();

}

}

/* USER INFO */

function showUserInfo(u){

const user =
users.find(
x=>x.username===u
);

if(user){

userInfo.innerHTML =
"👤 "
+
user.name
+
" ("
+
user.username
+
")";

}

}

/* LOGIN COUNT */

function handleLoginCount(user){

let count =
parseInt(

localStorage.getItem(
quizKey+
"_loginCount_"+
user
)||"0"

);

count++;

localStorage.setItem(

quizKey+
"_loginCount_"+
user,

count

);

loginCountBox.innerHTML =
"🔁 Login Count: "
+
count;

}

/* START QUIZ */

function startQuiz(){

if(
document.documentElement
.requestFullscreen
){

document.documentElement
.requestFullscreen();

}

renderPalette();

renderQuestion();

updateProgress();

startTimer();

}

/* TIMER */

function startTimer(){

timerInterval =
setInterval(()=>{

if(timeLeft<=0){

clearInterval(
timerInterval
);

submitQuiz();

return;

}

timeLeft--;

const min =
Math.floor(
timeLeft/60
);

const sec =
timeLeft%60;

timer.innerText =
"⏳ "
+
String(min)
.padStart(2,'0')
+
":"
+
String(sec)
.padStart(2,'0');

if(timeLeft<60){

timer.style.color =
"#ef4444";

}

},1000);

}
  /* PALETTE */

function renderPalette(){

paletteGrid.innerHTML='';

questions.forEach((q,i)=>{

const btn =
document.createElement(
'button'
);

btn.innerText=i+1;

btn.className =
'palette-btn';

if(
visitedQuestions.includes(i)
){
btn.classList.add(
'visited'
);
}

if(
userAnswers[i]!=null
){
btn.classList.add(
'answered'
);
}

if(i===currentQuestion){

btn.classList.add(
'current'
);

}

btn.onclick=()=>{

if(submitted) return;

currentQuestion=i;

renderQuestion();

};

paletteGrid
.appendChild(btn);

});

}

/* QUESTION */

function renderQuestion(){

if(submitted){

renderSubmittedQuestion();

return;

}

if(
!visitedQuestions.includes(
currentQuestion
)
){

visitedQuestions.push(
currentQuestion
);

}

const q =
questions[currentQuestion];

let optionsHTML = "";

q.options.forEach(
(opt,index)=>{

optionsHTML +=

'<label class="option">' +

'<input type="radio" ' +

'name="option" ' +

'value="'+index+'" ' +

(userAnswers[currentQuestion]
==index
? 'checked'
: '') +

' onchange="saveAnswer('
+
index+
')" > '

+

opt +

'</label>';

});

questionContainer.innerHTML =

'<div class="question-card">' +

'<div class="question-title">' +

'Q'+
(currentQuestion+1)
+
'. '
+
q.question +

'</div>' +

optionsHTML +

'</div>';

renderPalette();

updateProgress();

}

/* SAVE ANSWER */

function saveAnswer(ans){

if(submitted) return;

userAnswers[currentQuestion]
= ans;

renderPalette();

updateProgress();

}

/* PROGRESS */

function updateProgress(){

const answered =
userAnswers.filter(
x=>x!=null
).length;

const percent =
(answered/questions.length)
*100;

progressBar.style.width =
percent+'%';

}

/* NAVIGATION */

function nextQuestion(){

if(submitted) return;

if(
currentQuestion
<
questions.length-1
){

currentQuestion++;

renderQuestion();

}

}

function prevQuestion(){

if(submitted) return;

if(currentQuestion>0){

currentQuestion--;

renderQuestion();

}

}
  /* SUBMIT */

function submitQuiz(){

if(submitted) return;

submitted = true;

clearInterval(
timerInterval
);

const user =
sessionStorage.getItem(
quizKey+"_user"
);

let score = 0;

answers.forEach((ans,i)=>{

if(userAnswers[i]===ans){
score++;
}

});

/* SAVE */

localStorage.setItem(

quizKey+
"_submitted_"+
user,

"yes"

);

localStorage.setItem(

quizKey+
"_answers_"+
user,

JSON.stringify(
userAnswers
)

);

/* LOCK UI */

prevBtn.disabled=true;
nextBtn.disabled=true;

document.getElementById(
"submitBtn"
).style.display="none";

/* SCORE */

const finalScore =
"🎯 Score: "
+
score
+
"/"
+
answers.length;

result.innerHTML =
finalScore;

loginCountBox.innerHTML +=
" | "
+
finalScore;

logoutBtn.style.display =
"inline-block";

/* SHOW SUBMITTED MODE */

renderSubmittedQuestion();

}

/* SUBMITTED VIEW */

function renderSubmittedQuestion(){

const q =
questions[currentQuestion];

let optionsHTML = "";

q.options.forEach(
(opt,index)=>{

let className = "";

if(index===q.answer){

className="correct";

}

if(
userAnswers[currentQuestion]
===index
&&
index!==q.answer
){

className="wrong";

}

optionsHTML +=

'<label class="option '
+
className+
'">' +

'<input type="radio" disabled '

+

(userAnswers[currentQuestion]
==index
? 'checked'
: '') +

'> '

+

opt +

'</label>';

});

questionContainer.innerHTML =

'<div class="question-card">' +

'<div class="question-title">' +

'Q'+
(currentQuestion+1)
+
'. '
+
q.question +

'</div>' +

optionsHTML +

'</div>';

}

/* RESTORE */

function restoreSubmittedQuiz(){

const user =
sessionStorage.getItem(
quizKey+"_user"
);

const savedAnswers =
JSON.parse(

localStorage.getItem(
quizKey+
"_answers_"+
user
)||"[]"

);

userAnswers =
savedAnswers;

renderPalette();

renderSubmittedQuestion();

let score = 0;

answers.forEach((ans,i)=>{

if(savedAnswers[i]===ans){
score++;
}

});

const finalScore =
"🎯 Score: "
+
score
+
"/"
+
answers.length;

result.innerHTML =
finalScore;

loginCountBox.innerHTML =
"✅ Submitted | "
+
finalScore;

logoutBtn.style.display =
"inline-block";

document.getElementById(
"submitBtn"
).style.display =
"none";

prevBtn.disabled=true;
nextBtn.disabled=true;

}

/* LOGOUT */

function logout(){

sessionStorage.removeItem(
quizKey+"_user"
);

location.reload();

}

</script>

</body>

</html>
