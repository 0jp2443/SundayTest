if(submitted){

renderSubmittedQuestion();

return;

}

if(
!visitedQuestions.includes(
currentQuestion
)
){

visitedQuestions.push(
currentQuestion
);

}

const q =
questions[currentQuestion];

let optionsHTML = "";

q.options.forEach(
(opt,index)=>{

optionsHTML +=

'<label class="option">' +

'<input type="radio" ' +

'name="option" ' +

'value="'+index+'" ' +

(userAnswers[currentQuestion]
==index
? 'checked'
: '') +

' onchange="saveAnswer('
+
index+
')" > '

+

opt +

'</label>';

});

questionContainer.innerHTML =

'<div class="question-card">' +

'<div class="question-title">' +

'Q'+
(currentQuestion+1)
+
'. '
+
q.question +

'</div>' +

optionsHTML +

'</div>';

renderPalette();

updateProgress();

}

/* SAVE ANSWER */

function saveAnswer(ans){

if(submitted) return;

userAnswers[currentQuestion]
= ans;

renderPalette();

updateProgress();

}

/* PROGRESS */

function updateProgress(){

const answered =
userAnswers.filter(
x=>x!=null
).length;

const percent =
(answered/questions.length)
*100;

progressBar.style.width =
percent+'%';

}

/* NAVIGATION */

function nextQuestion(){

if(submitted) return;

if(
currentQuestion
<
questions.length-1
){

currentQuestion++;

renderQuestion();

}

}

function prevQuestion(){

if(submitted) return;

if(currentQuestion>0){

currentQuestion--;

renderQuestion();

}

}
  /* SUBMIT */

function submitQuiz(){

if(submitted) return;

submitted = true;

clearInterval(
timerInterval
);

const user =
sessionStorage.getItem(
quizKey+"_user"
);

let score = 0;

answers.forEach((ans,i)=>{

if(userAnswers[i]===ans){
score++;
}

});

/* SAVE */

localStorage.setItem(

quizKey+
"_submitted_"+
user,

"yes"

);

localStorage.setItem(

quizKey+
"_answers_"+
user,

JSON.stringify(
userAnswers
)

);

/* LOCK UI */

prevBtn.disabled=true;
nextBtn.disabled=true;

document.getElementById(
"submitBtn"
).style.display="none";

/* SCORE */

const finalScore =
"🎯 Score: "
+
score
+
"/"
+
answers.length;

result.innerHTML =
finalScore;

loginCountBox.innerHTML +=
" | "
+
finalScore;

logoutBtn.style.display =
"inline-block";

/* SHOW SUBMITTED MODE */

renderSubmittedQuestion();

}

/* SUBMITTED VIEW */

function renderSubmittedQuestion(){

const q =
questions[currentQuestion];

let optionsHTML = "";

q.options.forEach(
(opt,index)=>{

let className = "";

if(index===q.answer){

className="correct";

}

if(
userAnswers[currentQuestion]
===index
&&
index!==q.answer
){

className="wrong";

}

optionsHTML +=

'<label class="option '
+
className+
'">' +

'<input type="radio" disabled '

+

(userAnswers[currentQuestion]
==index
? 'checked'
: '') +

'> '

+

opt +

'</label>';

});

questionContainer.innerHTML =

'<div class="question-card">' +

'<div class="question-title">' +

'Q'+
(currentQuestion+1)
+
'. '
+
q.question +

'</div>' +

optionsHTML +

'</div>';

}

/* RESTORE */

function restoreSubmittedQuiz(){

const user =
sessionStorage.getItem(
quizKey+"_user"
);

const savedAnswers =
JSON.parse(

localStorage.getItem(
quizKey+
"_answers_"+
user
)||"[]"

);

userAnswers =
savedAnswers;

renderPalette();

renderSubmittedQuestion();

let score = 0;

answers.forEach((ans,i)=>{

if(savedAnswers[i]===ans){
score++;
}

});

const finalScore =
"🎯 Score: "
+
score
+
"/"
+
answers.length;

result.innerHTML =
finalScore;

loginCountBox.innerHTML =
"✅ Submitted | "
+
finalScore;

logoutBtn.style.display =
"inline-block";

document.getElementById(
"submitBtn"
).style.display =
"none";

prevBtn.disabled=true;
nextBtn.disabled=true;

}

/* LOGOUT */

function logout(){

sessionStorage.removeItem(
quizKey+"_user"
);

location.reload();

}

</script>

</body>

</html>
